name: Build Rabidanti Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Compile Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Rabidanti windows/launcher.py
      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/Rabidanti.exe"
          if ((Get-Item $exe).Length -lt 100000) { throw "Executable unexpectedly small." }
          Write-Host "EXE built: $exe"
          Get-FileHash $exe -Algorithm SHA256 | Format-List
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "windows/Rabidanti.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          if (!(Test-Path "dist/Rabidanti-Windows-Setup.exe")) { throw "Installer output missing." }
          Get-FileHash "dist/Rabidanti-Windows-Setup.exe" -Algorithm SHA256 | Format-List
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Rabidanti-Windows-Installer
          path: dist/Rabidanti-Windows-Setup.exe
          if-no-files-found: error
